<!doctype html>
<html lang="en">
  <head>
    <title>First accessibility scan demo</title>
    <style>
      button {
        width: 140px;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Request a service update</h1>
      <p>
        This page contains several deliberate accessibility issues for the first

        width="160"
        height="80"
      />
      <form>
        <p>Email address</p>
        <input id="email" name="email" type="email" />
        <p>Use the button below to request an update.</p>
        <button type="submit"></button>
      </form>
    </main>
  </body>
</html>
